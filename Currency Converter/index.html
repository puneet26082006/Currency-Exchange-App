<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="container">
        <h2>Currency Converter</h2>
        <form action="">
            <div class="amount">
                <label for="amount">Enter Amount</label>
                <input id="amount" type="text" inputmode="decimal" value="1" required>
            </div>
            <div class="dropdown">
                <div class="from">
                    <label for="from-currency">From</label>
                    <div class="select-container">
                        <img src="https://flagsapi.com/US/flat/64.png" alt="">
                        <select name="from" id="from-currency">

                        </select>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-right-arrow-left" aria-hidden="true"></i>
                <div class="to">
                    <label for="to-currency">To</label>
                    <div class="select-container">
                        <img src="https://flagsapi.com/IN/flat/64.png" alt="">
                        <select name="to" id="to-currency">

                        </select>
                    </div>
                </div>
            </div>
            <div class="msg" role="status" aria-live="polite" aria-atomic="true">
                Loading exchange rate…
            </div>
            <button type="submit">Get Exchange Rate</button>
        </form>
    </div>

    <script src="codes.js"></script>
    <script src="script.js"></script>
</body>

</html>
